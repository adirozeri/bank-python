# Local Postgres for development, mirroring the k8s deployment's credentials
# (bankuser/bankpass/bankdb). Start with: docker-compose up -d
# (no top-level `version:` — it's obsolete in Compose v2 and only prints a warning)

services:
  postgres:
    image: postgres:16
    container_name: bank-postgres
    environment:
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
      POSTGRES_DB: bankdb
    ports:
      - "5432:5432"
    volumes:
      - bank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankuser -d bankdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MCP server — a SEPARATE process/container that owns the LLM config + prompt files and
  # serves them over Streamable HTTP. The app (MCP client) reaches it at http://mcp:8000/mcp.
  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: bank-mcp
    env_file: .env
    ports:
      - "8000:8000"               # MCP server's public port
    healthcheck:                  # gate the app's startup on the server accepting connections
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 8000), 2).close()\""]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI app, built from the Dockerfile. On the EC2 box it reaches Postgres via
  # the service name `postgres` (set DATABASE_URL=...@postgres:5432/... in .env). Runs on 5002
  # (the MCP server holds 8000); fetches config/prompts from the `mcp` service over the network.
  app:
    build: .
    container_name: bank-app
    env_file: .env
    environment:
      MCP_SERVER_URL: http://mcp:8000/mcp   # reach the MCP server by Compose service name
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=5002
    ports:
      - "5002:5002"               # box:container — this is the public-facing API port
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy

  # Streamlit chat UI. Same image, different command. Talks HTTP to the app container
  # (API_URL=http://app:5002 — `app` is the Compose service name above).
  ui:
    build: .
    container_name: bank-ui
    env_file: .env
    environment:
      API_URL: http://app:5002
    command:
      - streamlit
      - run
      - ui/chat.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    ports:
      - "8501:8501"               # the UI's public port
    depends_on:
      - app

volumes:
  bank_pgdata:
