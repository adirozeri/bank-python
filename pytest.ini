[pytest]
# Let tests import the app package when running `pytest` from the repo root.
pythonpath = .
testpaths = tests
# --alluredir writes Allure result JSON every run; --clean-alluredir clears stale results
# first so the report reflects only the latest run. Render with: allure serve allure-results
addopts = --self-contained-html --alluredir=allure-results --clean-alluredir
