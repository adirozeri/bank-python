
llms:
  llm1:
    provider: google
    model: gemini-2.5-flash
    temperature: 0
    thoughts: true

  # Strong Gemini.
  llm2:
    provider: google
    model: gemini-2.5-pro
    temperature: 0
    thoughts: true

  llm3:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.2
    max_tokens: 1024
    thoughts: false

  # Anthropic Claude. With thoughts on, the builder enables thinking and forces temperature=1.
  llm4:
    provider: anthropic
    model: claude-sonnet-4-6
    temperature: 0
    thoughts: true

roles:
  user_intent: llm4                          
  risk_analysis: llm4  
  judge: llm4          
                       

# Persona key -> prompt file under prompts/persona/<name>.md. Controls user-facing tone.
personas:
  default: formal
  young: casual
  senior: formal
